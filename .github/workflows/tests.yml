name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"   # every Monday 01:00 UTC

# The demo site is shared and rate-limited: never run two workflow runs at the same time.
concurrency:
  group: parabank-demo
  cancel-in-progress: false

permissions:
  contents: read

# API and UI tests run as two jobs, one after the other. Each job gets a new runner, which
# spreads the requests to the rate-limited demo site instead of sending them all in one burst.
jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: API tests
        run: pytest -m api --junitxml=reports/api.xml --html=reports/api.html --self-contained-html

      - name: Summary
        if: always()
        run: python tools/junit_summary.py reports/api.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-reports
          path: reports/
          retention-days: 14

  ui:
    name: UI tests
    needs: api
    if: ${{ !cancelled() }}   # run the UI tests even when API tests fail
    runs-on: ubuntu-24.04     # pinned: Playwright's install-deps supports this image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install browser system libraries
        run: python -m playwright install-deps chromium

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: UI tests
        run: pytest -m ui --junitxml=reports/ui.xml --html=reports/ui.html --self-contained-html

      - name: Summary
        if: always()
        run: python tools/junit_summary.py reports/ui.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-reports
          path: |
            reports/
            test-results/
          retention-days: 14
